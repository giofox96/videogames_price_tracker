# Deploy su Render: New > Blueprint e scegli questo repository.
services:
  - type: web
    name: offerte-giochi
    runtime: node
    plan: starter          # sempre acceso + disco per salvare la wishlist (circa 7 $/mese)
    region: frankfurt
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /manifest.webmanifest
    disk:
      name: dati
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_FILE
        value: /var/data/db.json
      - key: SCAN_MINUTES
        value: "60"
      - key: ZIP
        value: "20100"
      - key: APP_PASSWORD
        sync: false
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: PRICECHARTING_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
